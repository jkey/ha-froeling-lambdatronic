rules:
  # Bronze
  action-setup:
    status: done
    comment: get_schedule and set_schedule are registered in async_setup for climate and water_heater entities.
  appropriate-polling:
    status: done
    comment: Modbus 30 s values / 5 min settings, Fröling Connect 2 min (rate limited cloud), system information hourly.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: Entities subscribe only to coordinators via CoordinatorEntity.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: >-
      Modbus TCP gateways offer no discovery protocol (no mDNS, SSDP or DHCP signature);
      Fröling Connect is an account, not a device on the network.
  discovery:
    status: exempt
    comment: >-
      Modbus TCP gateways offer no discovery protocol (no mDNS, SSDP or DHCP signature);
      Fröling Connect is an account, not a device on the network.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: >-
      The equipment is fixed by the installation of the boiler; components are not added at
      runtime, so the integration does not watch for new devices while running. A reconfigure
      reloads the entry and detects the equipment again: new components get a device, the devices
      of removed ones are deleted.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
